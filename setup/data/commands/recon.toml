[command.SPN-0]
use_name = "setspn"
local = false
cmd_types = "recon"
args = "setspn -T <domain|domain.corp> -Q <spn-wildcard|*/*>"
short_desc = "Search for spn in the domain"
examples = [
    "setspn -T corp -Q MSSQLSvc/*"
]

[command.WMI-LocalAdmin-SID]
use_name = "wmi-local-admin-SID"
local = true
cmd_types = "recon"
args = "[WMI]\"Win32_userAccount.Domain='$env:computername',Name='Administrator'\""
short_desc = "WMI - SID retrieval of local Administrator in PS"

[command.PowerView-LDAP-DACL]
use_name = "PowerView LDAP"
local = true
cmd_types = "recon"
args = ". .\\PowerView.ps1; Get-ObjectAcl -Identity <identity|user> -ResolveGUIDs | Foreach-Object {$_ | Add-Member -NotePropertyName Identity -NotePropertyValue (ConvertFrom-SID $_.SecurityIdentifier.value) -Force; $_}"
short_desc = "PowerView - List DACL on targeted object"

[command.Windows-Service]
use_name = "wmi-services"
local = true
cmd_types = "sysadmin"
short_desc = "WMI - List All Windows Services"
args = "Get-CimInstance -ClassName win32_service | Select PathName,Name,State,StartName,StartMode"
examples = [
    "Get-CimInstance -ClassName win32_service | Select PathName,Name,State,StartName,StartMode",
    "Get-CimInstance -ClassName win32_service | Select Name,State,PathName,StartMode | Where-Object {$_.State -like 'Running'}",
    "Get-CimInstance -ClassName win32_service | Select Name, StartMode | Where-Object {$_.Name -like 'mysql'}"
]

[command.Windows-DCOM]
use_name = "wmi-dcom"
local = true
cmd_types = "sysadmin"
short_desc = "WMI - List All Windows DCOM"
args = "Get-CimInstance Win32_DCOMApplication"

[command.Nmap-All-Port-Scan]
use_name = "nmap"
local = false
cmd_types = "pentest|recon"
short_desc = "Scanning all ports with SYN scan and saving in file"
args = "nmap -n -sV -sS -Pn -p- -oN <output_file|scan.txt> <destination|127.0.0.1>"
examples = [
    "nmap -sV -sS -Pn -p- -oN scan.nmap 127.0.0.1"
]

[command.Nmap-Windows]
use_name = "nmap"
local = false
cmd_types = "pentest|recon|windows"
short_desc = "Scanning Windows well-known ports"
args = "nmap -n -Pn -p21,22,53,80,88,135,139,143,443,445,1433,1521,3128,3306,3389,5985,5986,8080,8443 -oN windows_scan.txt <destination|127.0.0.1>"

[command.Nmap-Version-Script]
use_name = "nmap"
local = false
cmd_types = "pentest|recon"
short_desc = "Version -sV, default script -sC"
args = "nmap -n -sC -sV <ip|127.0.0.1>"
examples = [
    "nmap -sC -sV 127.0.0.1",
    "nmap -sV -p 443 --script 'vuln'"
]

[command.Nmap-SMB-OS-Discovery]
use_name = "SMB"
local = false
cmd_types = "pentest|recon"
short_desc = "SMB OS discovery"
args = "nmap -n -p139,445 --script smb-os-discovery <ip|127.0.0.1>"
examples = [
    "nmap -n -p139,445 --script smb-os-discovery  127.0.0.1"
]

[command.Nmap-UDP-Scan]
use_name = "nmap"
local = false
cmd_types = "pentest|recon"
short_desc = "Full UDP Scan"
args = "nmap -sS -sU -p- <ip|127.0.0.1> -oN scan-udp.txt"
examples = [
    "nmap -sS -sU -p- -T4 --min-rate 1000 127.0.0.1 -oN scan-udp.txt"
]

[command.DNSEnumType]
use_name = "dnsenum"
local = false
cmd_types = "pentest|network|recon"
short_desc = "DNS Enumeration with type handling"
args = "dnsenum -t <type|any> <hostname>"
examples = [
    "dnsenum -t mx example.com"
]

[command.Enum4Linux]
use_name = "enum4linux"
local = false
cmd_types = "pentest|network"
short_desc = "Enumeration"
args = "enum4linux <hostname>"
examples = [
    "enum4linux example.com"
]

[command.OneSixtyOne]
use_name = "onesixtyone"
local = false
cmd_types = "pentest|network|enum"
short_desc = "SNMP Bruteforce Attack"
args = "onesixtyone -c <communities_file> -i <ips_file>"
examples = [
    "onesixtyone -c communities.txt -i ips.txt"
]

[command.SNMPWalk]
use_name = "snmpwalk"
local = false
cmd_types = "pentest|network|enum"
short_desc = "SNMP Enumeration"
args = "snmpwalk -c <community|public> -v1 -t 10 <ip|127.0.0.1> -Oa"
examples = [
    "snmpwalk -c public -v1 -t 10 127.0.0.1 -Oa # Enumerate entire MIB Tree (-Oa: used to decode hexadecimal)",
    "snmpwalk -c public -v1 127.0.0.1 1.3.6.1.4.1.77.1.2.25  # Enumerate all users on the Windows machine",
    "snmpwalk -c public -v1 192.168.50.151 1.3.6.1.2.1.25.4.2.1.2  # List all machine running processes",
    "snmpwalk -c public -v1 192.168.50.151 1.3.6.1.2.1.25.6.3.1.2  # List all machine installed softwares",
    "snmpwalk -c public -v1 192.168.50.151 1.3.6.1.2.1.6.13.1.3  # List all machine TCP listening ports"
]

[command.Nmap-3]
use_name = "nmap"
local = true
cmd_types = "sysadmin"
short_desc = "Search vuln in nmap scripts"
args = "cat /usr/share/nmap/scripts/script.db | grep '<search|safe>'"
details = """
Search in the nmap NSE scripts for vuln (can search the impact of the script - safe/intrusive).
There is also an example of reloading the script.db file if a new '.nse' file was added."""
examples = [
    "cat /usr/share/nmap/scripts/script.db | grep 'vuln'",
    "nmap --script-updatedb"
]

[command.LDAPDomainDump]
use_name = "ldapdomaindump"
local = false
cmd_types = "pentest"
short_desc = "Dump LDAP information"
args = "ldapdomaindump -u '<DOMAIN/user|CORP.local/user>' -p '<LM:NTLM>' -at NTLM ldap://<ip|127.0.0.1>"
examples = [
    "ldapdomaindump -u 'CORP.local/user' -p 'ba0ecf3dcda348e7a91e548719c3ac6e:12943dbced43cd06a0445dd11fac3a7d' -at NTLM ldap://127.0.0.1"
]

[command.LDAPSearch]
use_name = "ldapsearch"
local = false
cmd_types = "pentest|recon"
short_desc = "LDAP Enumeration using Kerberos (-Y GSSAPI)"
args = "ldapsearch -Y GSSAPI -H ldap://<URI|dc01.domain.corp> -D '<binddn>' -W -b '<basedn>' 'servicePrincipalName=<spn|*>' servicePrincipalName"
examples = [
    "ldapsearch -Y GSSAPI -H ldap://dc01.corp1.com -D 'Administrator@DOMAIN.CORP' -W -b 'dc=corp1,dc=com' 'servicePrincipalName=*' servicePrincipalName"
]

[command.PsPy64s0]
use_name = "pspy64s"
local = true
cmd_types = "pentest|linux"
short_desc = "Check on processes during execution"
details = """
Pspy is a command line tool designed to snoop on processes without need for root permissions.
It allows you to see commands run by other users, cron jobs, etc. as they execute."""
args = "pspy64s -i <milli|100>"
examples = [
    "pspy64s -i 100"
]

[command.CrackMapExec]
use_name = "cme"
local = false
cmd_types = "pentest"
short_desc = "List shares on list of machines"
args = "cme smb <ipsfile|ips.txt> -u <username> -H <NTHASH> --shares"
examples = [
    "crackmapexec smb ips.txt -u user -H <NTHASH> --shares"
]

[command.NetExec]
use_name = "nxc"
local = false
cmd_types = "pentest|recon"
short_desc = "Show access on list of machines"
args = "nxc smb <ipsfile|ips.txt> -u <username> -p <password|password>"
examples = [
    "nxc smb ips.txt -u user -p 'password' -d corp.com"
]

[command.NetExec2]
use_name = "nxc"
local = false
cmd_types = "pentest|recon"
short_desc = "List users on machine"
args = "nxc <protocol|smb> -u <username> -p <password|password> <hostname|127.0.0.1> --rid-brute"
examples = [
    "nxc mssql 127.0.0.1 -u kevin -p 'pass' --rid-brute"
]

