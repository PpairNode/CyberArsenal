[command.Hashcat]
use_name = "hashcat"
local = true
cmd_types = "credentials|cracking"
short_desc = "Cracking hashes software"
details = """
Crack password of a chosen <type>.
This can be combined with hashid to find type of hash:
$ hashid <hash>"""
args = "hashcat -m <type> <hashfile|hash.txt> <wordlist|/usr/share/wordlists/rockyou.txt>"
examples = [
    "hashcat -m 3200 hash.txt /usr/share/wordlists/rockyou.txt"
]

